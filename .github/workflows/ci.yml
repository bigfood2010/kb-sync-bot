name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.15.0
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: docker build -t kb-sync-bot .
      - run: docker run --rm --entrypoint python kb-sync-bot -c "import main"
